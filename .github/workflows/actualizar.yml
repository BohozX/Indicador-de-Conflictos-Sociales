name: Actualizar indicador

on:
  schedule:
    # UTC. Cada dos horas, alejado del inicio de hora congestionado.
    - cron: "23 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: indicador-conflictos-sociales
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}

    steps:
      - name: Descargar repositorio publico
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Descargar el motor privado
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          repository: ${{ secrets.DEV_VAULT_REPOSITORY }}
          ref: main
          ssh-key: ${{ secrets.DEV_VAULT_DEPLOY_KEY }}
          path: private
          sparse-checkout: |
            ${{ secrets.DEV_VAULT_CORE_PATH }}
          sparse-checkout-cone-mode: true
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.13'

      - name: Validar configuracion privada
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          test -n "$CORE_PATH"
          case "$CORE_PATH" in
            /*|*..*) echo "Ruta privada no valida" >&2; exit 1 ;;
          esac
          test -f "private/$CORE_PATH/src/main.py"

      - name: Instalar dependencias
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          python -m pip install -r "private/$CORE_PATH/requirements.txt"

      - name: Ejecutar el indicador
        id: ejecutar
        continue-on-error: true
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile "private/$CORE_PATH/src/main.py"
          python "private/$CORE_PATH/src/main.py"

          for f in fuentes_base/ABCdata.csv historico/bloqueos_historico.csv \
                   monitoreo/ultimos_7_dias.csv reporte_estado.png; do
            if [ ! -s "private/$CORE_PATH/$f" ]; then
              echo "ERROR: $f no existe o esta vacio" >&2
              exit 1
            fi
          done
          test -d "private/$CORE_PATH/bloqueos_diarios"

      - name: Guardar los datos en el vault privado
        if: steps.ejecutar.outcome == 'success'
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          git -C private add -- "$CORE_PATH"
          if git -C private diff --cached --quiet; then
            echo "El vault ya esta al dia."
            exit 0
          fi
          git -C private config user.name "Daniel Bohoz Oros Trujillo"
          git -C private config user.email "283808960+BohozX@users.noreply.github.com"
          git -C private commit -m "ICS-Core: actualizacion automatica"
          for attempt in 1 2 3; do
            git -C private pull --rebase origin main
            if git -C private push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "No se pudo sincronizar Dev-Vault despues de 3 intentos." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Publicar la serie de 90 dias y la logica del calculo
        if: steps.ejecutar.outcome == 'success'
        shell: bash
        env:
          CORE_PATH: ${{ secrets.DEV_VAULT_CORE_PATH }}
        run: |
          set -euo pipefail
          python herramientas/preparar_publico.py \
            "private/$CORE_PATH/historico/bloqueos_historico.csv" \
            pagina/data
          python herramientas/extraer_logica.py \
            "private/$CORE_PATH/src/main.py" \
            codigo/indicador.py
          python herramientas/verificar_publico.py

      - name: Guardar los cambios publicos
        if: steps.ejecutar.outcome == 'success'
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain pagina/data codigo)" ]; then
            echo "Sin cambios publicos."
            exit 0
          fi
          git config user.name "Daniel Bohoz Oros Trujillo"
          git config user.email "283808960+BohozX@users.noreply.github.com"
          git add pagina/data codigo
          git commit -m "Actualizacion automatica"
          REMOTO="https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase "$REMOTO" main
            if git push "$REMOTO" HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "No se pudieron guardar los datos publicos despues de 3 intentos." >&2
              exit 1
            fi
            sleep $((attempt * 2))
          done

      - name: Configurar Pages
        if: steps.ejecutar.outcome == 'success'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Subir el sitio
        if: steps.ejecutar.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: pagina
          retention-days: 1

      - name: Desplegar
        id: despliegue
        if: steps.ejecutar.outcome == 'success'
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Propagar el fallo
        if: steps.ejecutar.outcome == 'failure'
        run: exit 1

  cleanup-artifact:
    name: Eliminar artifact temporal
    needs: actualizar
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Eliminar artifact del despliegue
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.name == "github-pages") | .id' |
          while read -r artifact_id; do
            test -n "$artifact_id"
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
          done
